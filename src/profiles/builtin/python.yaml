name: python
image: python:3.12-bookworm
env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
mounts:
  - type: bind
    source: ${WORKSPACE}
    target: /workspace
  - type: volume
    name: python-cache
    target: /root/.cache/pip
secrets:
  allowed:
    - name: GITHUB_TOKEN
      hosts: ["github.com", "api.github.com"]
      requireTls: true
    - name: PYPI_TOKEN
      hosts: ["upload.pypi.org", "pypi.org"]
      requireTls: true
