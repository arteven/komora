name: nodejs
image: node:20-bookworm
env:
  NODE_ENV: development
mounts:
  - type: bind
    source: ${WORKSPACE}
    target: /workspace
  - type: volume
    name: nodejs-cache
    target: /root/.npm
secrets:
  allowed:
    - name: GITHUB_TOKEN
      hosts: ["github.com", "api.github.com"]
      requireTls: true
    - name: NPM_TOKEN
      hosts: ["registry.npmjs.org"]
      requireTls: true
startup:
  - npm config set registry https://registry.npmjs.org
